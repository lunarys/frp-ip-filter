name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[skip release]') == false)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cycjimmy/semantic-release-action@v6.0.0
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      packages: write
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Fast despite arm64: the Dockerfile cross-compiles on the build
          # platform instead of emulating arm64 under QEMU.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lunarys/frp-ip-filter:${{ needs.release.outputs.new_release_version }}
            ghcr.io/lunarys/frp-ip-filter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
